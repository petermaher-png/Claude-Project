version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmg
      POSTGRES_PASSWORD: pmg_dev_password
      POSTGRES_DB: pmg_solution_engine
    ports:
      - "5432:5432"
    volumes:
      - pmg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pmg_pgdata:
